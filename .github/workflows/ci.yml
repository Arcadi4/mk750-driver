name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # The package targets macOS 27, which needs the Xcode 27 image's SDK.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test
