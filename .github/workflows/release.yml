name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    # The package targets macOS 27, which needs the Xcode 27 image's SDK.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Bundle app
        run: ./scripts/bundle.sh

      - name: Archive app
        run: ditto -c -k --keepParent dist/MK750.app dist/MK750.app.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/MK750.app.zip --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
